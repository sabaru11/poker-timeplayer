<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<link rel="manifest" href="/poker-timeplayer/manifest.json">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Poker Timer">

<link rel="apple-touch-icon" href="/poker-timeplayer/icon.png">

<title>Player playtime</title>

<style>
body {
    font-family: Arial;
    background: #0d0d0d;
    color: #fff;
    margin: 0;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
}

.timer-row {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}

#timer {
    font-size: 35vw;
    font-weight: bold;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    transition: 0.2s;
    position: relative;
    display: inline-block;
}

.danger {
    color: red;
}

/* เวลาหยุด = เหลือง */
.paused {
    color: #ffd400;
}

#timer:active {
    transform: scale(0.95);
    opacity: 0.7;
}

/* ต้องอยู่หลัง .paused เพื่อให้สีเขียวทับสีเหลืองตอนกดค้าง */
.active-touch {
    color: rgb(0, 255, 13);
}

/* กดค้างครบเวลาแล้ว: ให้แสดงสีตามสถานะจริง ไม่เป็นสีเขียว */
.active-touch.done {
    color: #fff;
}
.active-touch.done.paused {
    color: #ffd400;
}
.active-touch.done.danger {
    color: red;
}

#stack {
    font-size: 30px;
    color: #00ffcc;
}

.stack_div {
  position: absolute;
  right: 20px;
  top: 20px;
}

@keyframes flash {
    0% { opacity: 1; }
    50% { opacity: 0.3; }
    100% { opacity: 1; }
}

.flash {
    animation: flash 1s infinite ease-in-out;
}

#ms {
    position: absolute;
    bottom: 8%;
    right: -8%;
    font-size: 6vw;
    font-weight: normal;
    opacity: 0.6;
    color: inherit;
}
</style>

</head>

<body>

<div class="stack_div" id="stack">0</div>

<div class="timer-row" id="tapArea">
    <div class="clicktime" id="timer">30<span id="ms">00</span></div>
</div>

<script>
let maxTime = 25;
let stack = 0;
let rafId;
let endTime = 0;
let startTime = 0;
let lastWholeSecond = null;

/* ⏸ หยุดเวลา (หน่วยมิลลิวินาที: 1000 = 1 วินาที) */
const HOLD_MS = 2000;
let isPaused = false;
let pausedRemaining = 0;
let holdTimeout = null;
let longPressDone = false;
let restartTimeout = null;

/* 👆 เคาะ 2 ครั้งเพื่อรีเซ็ต (หน่วยมิลลิวินาที) */
const DOUBLE_TAP_MS = 400;
let lastTapTime = 0;

/* 🔊 เสียง */
let audioCtx;
let audioUnlocked = false;

function unlockAudio() {
    if (audioUnlocked) return;

    audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    const buffer = audioCtx.createBuffer(1, 1, 22050);
    const source = audioCtx.createBufferSource();
    source.buffer = buffer;
    source.connect(audioCtx.destination);
    source.start(0);

    audioUnlocked = true;
}

function playSharp() {
    if (!audioUnlocked) return;

    if (audioCtx.state === "suspended") {
        audioCtx.resume();
    }

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = "square";
    osc.frequency.value = 1400;

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();

    gain.gain.setValueAtTime(1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioCtx.currentTime + 0.05
    );

    osc.stop(audioCtx.currentTime + 0.05);
}

/* 🔥 เสียงตอนหมดเวลา */
function playEnd() {
    if (!audioUnlocked) return;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = "square";
    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.2);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    gain.gain.setValueAtTime(1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);

    osc.start();
    osc.stop(audioCtx.currentTime + 0.2);
}

const timerDisplay = document.getElementById("timer");
const msDisplay = document.getElementById("ms");
const stackDisplay = document.getElementById("stack");
const tapArea = document.getElementById("tapArea");

function startTimer() {
    cancelAnimationFrame(rafId);
    clearTimeout(restartTimeout);
    restartTimeout = null;

    isPaused = false;
    startTime = Date.now();
    endTime = startTime + maxTime * 1000;
    lastWholeSecond = null;

    timerDisplay.classList.remove("danger", "flash", "paused");

    tick();
}

function tick() {
    const remaining = endTime - Date.now();

    if (remaining <= 0) {
        // หมดเวลา
        renderTime(0, 0);

        if (audioUnlocked) {
            playEnd();
        }

        stack++;
        updateStack();

        restartTimeout = setTimeout(() => {
            restartTimeout = null;
            startTimer();
        }, 300);

        return;
    }

    const wholeSecond = Math.ceil(remaining / 1000);
    const elapsed = Date.now() - startTime;
    const ms = elapsed % 1000;

    renderTime(wholeSecond, ms);

    if (wholeSecond !== lastWholeSecond) {
        lastWholeSecond = wholeSecond;

        if (wholeSecond <= 10) {
            timerDisplay.classList.add("danger");
        }

        if (wholeSecond <= 5) {
            timerDisplay.classList.add("flash");
            if (audioUnlocked) {
                playSharp();
            }
        } else {
            timerDisplay.classList.remove("flash");
        }
    }

    rafId = requestAnimationFrame(tick);
}

function renderTime(sec, ms) {
    timerDisplay.childNodes[0].nodeValue = sec;
    msDisplay.innerText = String(Math.floor(ms / 10)).padStart(2, "0");
}

function updateStack() {
    stackDisplay.innerText = stack;
}

/* ⏸ หยุด / ▶ เล่นต่อ */
function pauseTimer() {
    cancelAnimationFrame(rafId);

    if (restartTimeout) {
        // กดตอนหมดเวลาพอดี (รอรีสตาร์ท) → หยุดที่เวลาเต็ม
        clearTimeout(restartTimeout);
        restartTimeout = null;
        pausedRemaining = maxTime * 1000;
        renderTime(maxTime, 0);
    } else {
        pausedRemaining = Math.max(0, endTime - Date.now());
    }

    isPaused = true;
    timerDisplay.classList.remove("danger", "flash");
    timerDisplay.classList.add("paused");
}

function resumeTimer() {
    isPaused = false;
    endTime = Date.now() + pausedRemaining;
    startTime = endTime - maxTime * 1000;
    lastWholeSecond = null;

    timerDisplay.classList.remove("paused");

    tick();
}

function toggleHold() {
    if (isPaused) {
        resumeTimer();
    } else {
        pauseTimer();
    }
}

/* 👆 จัดการการกด: เคาะ 2 ครั้ง = รีเซ็ต, กดค้าง = หยุด/เล่นต่อ */
function handleDown() {
    timerDisplay.classList.add("active-touch");
    timerDisplay.classList.remove("done");
    longPressDone = false;

    clearTimeout(holdTimeout);
    holdTimeout = setTimeout(() => {
        longPressDone = true;
        toggleHold();
        timerDisplay.classList.add("done");   // ครบเวลา → เปลี่ยนเป็นสีตามสถานะ
    }, HOLD_MS);
}

function handleUp() {
    clearTimeout(holdTimeout);
    timerDisplay.classList.remove("active-touch", "done");

    if (!audioUnlocked) unlockAudio();

    if (longPressDone) {
        // เพิ่งกดค้างหยุด/เล่นต่อ ไม่นับเป็นการเคาะ
        lastTapTime = 0;
    } else {
        const now = Date.now();
        if (now - lastTapTime <= DOUBLE_TAP_MS) {
            // เคาะครั้งที่ 2 ทันเวลา → รีเซ็ต
            stack = 0;
            updateStack();
            startTimer();
            lastTapTime = 0;
        } else {
            // เคาะครั้งแรก → จำเวลาไว้ ยังไม่ทำอะไร
            lastTapTime = now;
        }
    }
    longPressDone = false;
}

function handleCancel() {
    clearTimeout(holdTimeout);
    timerDisplay.classList.remove("active-touch", "done");
    longPressDone = false;
}

/* มือถือ */
tapArea.addEventListener("touchstart", (e) => {
    e.preventDefault();          // กัน iOS เด้งเมนู/เลือกข้อความ/ยกเลิก touch
    handleDown();
}, { passive: false });

tapArea.addEventListener("touchend", (e) => {
    e.preventDefault();
    handleUp();
}, { passive: false });

tapArea.addEventListener("touchcancel", handleCancel);

/* เมาส์ (เผื่อทดสอบบนคอม) */
tapArea.addEventListener("mousedown", handleDown);
tapArea.addEventListener("mouseup", handleUp);
tapArea.addEventListener("mouseleave", handleCancel);

tapArea.addEventListener("contextmenu", (e) => e.preventDefault());

startTimer();
</script>

</body>
</html>
